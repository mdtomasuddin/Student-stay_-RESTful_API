stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  variables:
    FTP_SERVER: "72.62.213.250"
    FTP_USERNAME: "backend_ftp"
    FTP_PASSWORD: "5wKYxieo6Sp5ZWic8oDs"
    FTP_PATH: "/" 
  before_script:
    - apk add --no-cache lftp
  script:
    - |
      lftp -u "$FTP_USERNAME","$FTP_PASSWORD" $FTP_SERVER <<EOF
      set ftp:ssl-allow no
      set ftp:use-site-chmod false
      set ftp:preserve-permissions false
      mirror -R --verbose --only-newer --no-perms \
        --exclude-glob vendor/ \
        --exclude-glob .env \
        --exclude-glob .git/ \
        ./ $FTP_PATH
      quit
      EOF
  only:
    - dev